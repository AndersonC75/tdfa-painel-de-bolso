; Painel de bolso da Tropa do Fogo Amigo, para o M5StickC Plus2.
; Gravar:  pio run -t upload   (placa ligada por USB-C)
; Ver o log:  pio device monitor

[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7
